spring.application.name=CIM


# Server Port
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/customer_db
spring.datasource.username=postgres
spring.datasource.password=user
spring.datasource.driver-class-name=org.postgresql.Driver


spring.sql.init.mode=always


# SQL Logging
# logging.level.org.springframework.jdbc.core=DEBUG


# Log file location
logging.file.name=logs/cim-application.log

# Root logging level
logging.level.root=INFO

# Your application package logging level
logging.level.com.customer=DEBUG


spring.security.user.name= user
spring.security.user.password = user